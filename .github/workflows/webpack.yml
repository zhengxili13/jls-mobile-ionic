name: CI

on:
  push:
    branches-ignore:
      - main        # main 由 CD 处理，CI 覆盖其他所有分支
  pull_request:     # PR 也触发 CI 检查

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true   # lint 失败不阻断构建，仅作警告

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: www-${{ github.sha }}
          path: www/
          retention-days: 3       # CI 产物只保留 3 天
