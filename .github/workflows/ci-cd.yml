name: CI / CD

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: www-${{ github.sha }}
          path: www/
          retention-days: 3

  cd:
    name: CD
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration=production --base-href=/${{ github.event.repository.name }}/
        env:
          NODE_ENV: production

      - name: Fix SPA routing (404 fallback)
        run: cp www/index.html www/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  deploy-android:
    name: Build & Deploy Android
    needs: cd
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build -- --configuration=production

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Set Android Versioning, Title & Version File
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          # Use github.run_number with an offset to avoid version code collision with manual uploads
          VERSION_CODE=$(( ${{ github.run_number }} + 10 ))
          FULL_VERSION="${VERSION_NAME}(${VERSION_CODE})"
          
          # 1. Update Android Gradle files
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Building version $FULL_VERSION"

          # 2. Create version file
          echo "Build Version: $FULL_VERSION" > "${FULL_VERSION}.txt"

          # 3. Update Workflow Run Title (requires actions: write permission)
          gh run edit ${{ github.run_id }} --name "build and publish google play ${FULL_VERSION}" || echo "Could not update run title"

      - name: Build Android App Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign AAB
        id: sign_aab
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release/
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GPLAY_SERVICE_ACCOUNT_KEY_JSON }}
          packageName: jlsimport.app
          releaseFiles: ${{ steps.sign_aab.outputs.signedReleaseFile }}
          track: alpha

  deploy-ios:
    name: Build & Deploy iOS
    needs: cd
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build -- --configuration=production

      - name: Capacitor Sync
        run: npx cap sync ios

      - name: Set iOS Versioning
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=$(( ${{ github.run_number }} + 10 ))
          cd ios/App
          # Ensure agvtool is working
          xcrun agvtool new-marketing-version $VERSION_NAME
          xcrun agvtool new-version -all $VERSION_CODE

      - name: Import Code Signing Certificates
        uses: apple-actions/import-codesigning-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ios/App/App/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>jlsimport.app</key>
              <string>App Store Distribution Profile</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -archivePath ios/App/App.xcarchive archive
          xcodebuild -exportArchive -archivePath ios/App/App.xcarchive -exportOptionsPlist ios/App/App/ExportOptions.plist -exportPath ios/App/build

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ios/App/build/App.ipa
          issuer-id: ${{ secrets.APPLE_APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_ID }}
          api-key-content: ${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}
